# version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: LoanRepayments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - postgres_network

  web:
    build:
      context: .
    command: ./entrypoint.sh
    volumes:
      - .:/LoanRepayments
      - static_volume:/LoanRepayments/static  # Added this line
      - media_volume:/LoanRepayments/media  # Add this
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DEBUG: "True"
      DB_NAME: "LoanRepayments"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
    networks:
      - postgres_network
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/LoanRepayments/static
      - media_volume:/LoanRepayments/media   # Add this
    depends_on:
      - web
    networks:
      - postgres_network    

networks:
  postgres_network:

volumes:
  postgres_data:
  static_volume:  # Added this volume
  media_volume: # Define it here
